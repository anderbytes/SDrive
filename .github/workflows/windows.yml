name: Windows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, tests, self-check and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Check -Installer
      - name: Native Wails and WebView2 smoke (required)
        timeout-minutes: 6
        shell: pwsh
        run: node scripts/ui-smoke.mjs
      - name: Uninstall retry regression checks
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/test-uninstall.ps1
      - name: Race detector (Windows x64, GCC)
        env:
          SDRIVE_TEST_ENGINE: '1'
        shell: pwsh
        run: ./scripts/test-race.ps1
      - name: Static checks
        shell: pwsh
        run: ./.tools/go/bin/go.exe vet ./...
      - name: Report conditional check results
        if: always()
        shell: pwsh
        run: node scripts/check-results.mjs
      - name: Native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SDrive-check-results
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .tools/check-results/summary.md
            .tools/check-results/ui-smoke/*/result.json
            .tools/check-results/ui-smoke/*/*.png
      - name: Verify installer artifacts for the package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'frontend/package.json' -Raw | ConvertFrom-Json).version
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Artifacts require a stable three-part package version' }
          foreach ($name in @("SDrive-$version-setup.exe", "SDrive-$version-offline-setup.exe")) {
            if (!(Test-Path -LiteralPath "bin/$name" -PathType Leaf)) { throw "Missing installer: $name" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: SDrive-windows-x64
          if-no-files-found: error
          path: |
            bin/SDrive-${{ steps.package.outputs.version }}-setup.exe
            bin/SDrive-${{ steps.package.outputs.version }}-offline-setup.exe
            bin/SDrive-source.zip
            bin/rclone-source.zip
            bin/SHA256SUMS
